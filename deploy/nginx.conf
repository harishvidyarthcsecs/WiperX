# wiperx/deploy/nginx.conf
#
# Reverse proxy for the `web` service. Buffering is off for the SSE
# endpoints (/wipe/execute, /recovery/stream/) so live log lines reach the
# browser as they're written instead of waiting for nginx's buffer to fill.
# Body size is raised for the eraser/recovery forms, which can carry long
# newline-separated path lists.

upstream wiperx_web {
    server web:5000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://wiperx_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events streams: disable buffering so log lines arrive
    # live rather than batched.
    location ~ ^/(wipe/execute|recovery/stream/) {
        proxy_pass http://wiperx_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }
}
