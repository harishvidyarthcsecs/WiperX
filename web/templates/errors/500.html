{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h3 class="mb-3 text-danger"><i class="bi bi-exclamation-octagon"></i> 500 — Server Error</h3>
  <p class="text-muted">Something went wrong handling that request. The error has
    been logged. No further detail is shown here.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-danger mt-2">
    <i class="bi bi-speedometer2 me-1"></i> Back to Dashboard
  </a>
</div>
{% endblock %}
