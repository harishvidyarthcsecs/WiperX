<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiperX — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-top: 3px solid #e74c3c;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            color: #e74c3c;
            letter-spacing: 6px;
            text-align: center;
            margin-bottom: 4px;
        }
        .logo-sub {
            text-align: center;
            color: #8b949e;
            font-size: 0.82rem;
            margin-bottom: 32px;
            letter-spacing: 2px;
        }
        .form-control {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        .form-control:focus {
            background: #0d1117;
            border-color: #e74c3c;
            color: #fff;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.15);
        }
        .btn-login {
            background: #e74c3c;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .btn-login:hover { background: #c0392b; }
        .demo-creds {
            background: rgba(88, 166, 255, 0.08);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.78rem;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo"><i class="bi bi-shield-fill-x"></i> WIPERX</div>
        <div class="logo-sub">DISK SANITIZATION SYSTEM</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2 mb-3" style="font-size:0.85rem">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label text-muted small">USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text" style="background:#0d1117; border-color:#30363d; color:#8b949e">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text" style="background:#0d1117; border-color:#30363d; color:#8b949e">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" name="password" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-login btn-danger text-white">
                <i class="bi bi-box-arrow-in-right me-2"></i>SIGN IN
            </button>
        </form>

        <div class="demo-creds mt-4">
            <strong style="color:#58a6ff">Demo Credentials</strong><br>
            admin / admin123 &nbsp;|&nbsp; operator / operator123 &nbsp;|&nbsp; viewer / viewer123<br>
            <span class="text-warning">⚠ Change before production deployment</span>
        </div>
    </div>
</body>
</html>
