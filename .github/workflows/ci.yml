name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System deps for forensic recovery
        run: sudo apt-get update && sudo apt-get install -y libmagic1 sleuthkit
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: |
          black --check .
          flake8 .
      - name: Tests
        run: pytest -q --cov=core --cov=cli --cov=web --cov-report=term-missing
